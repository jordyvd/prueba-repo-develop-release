name: Check branch sync

on:
  pull_request:

jobs:
  check-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: |
          git fetch origin ${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}

      - name: Check that ${{ github.base_ref }} has no unique commits
        run: |
          DIFF=$(git log origin/${{ github.head_ref }}..origin/${{ github.base_ref }} --no-merges)

          if [ -n "$DIFF" ]; then
            echo "❌ Branch '${{ github.base_ref }}' has commits not present in '${{ github.head_ref }}':"
            echo "$DIFF"
            exit 1
          fi

          echo "✅ Branches are synchronized"
