name: Check branch sync

on:
  pull_request:
    branches:
      - release

jobs:
  check-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: |
          git fetch origin release
          git fetch origin ${{ github.head_ref }}

      - name: Check that release has no unique commits
        run: |
          DIFF=$(git log origin/${{ github.head_ref }}..origin/release --no-merges)

          if [ -n "$DIFF" ]; then
            echo "❌ Release has commits that are not in the PR branch:"
            echo "$DIFF"
            exit 1
          fi

          echo "✅ Branches are synchronized"
